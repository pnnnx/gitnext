[package]
name = "gitnext-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
gitnext-core = { version = "0.1.0", path = "../gitnext-core" }
gitnext-docs = { version = "0.1.0", path = "../gitnext-docs" }
gitnext-index = { version = "0.1.0", path = "../gitnext-index" }
gitnext-ops = { version = "0.1.0", path = "../gitnext-ops" }
gitnext-parse = { version = "0.1.0", path = "../gitnext-parse" }
gitnext-tui = { version = "0.1.0", path = "../gitnext-tui" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "gitnext"
path = "src/main.rs"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
