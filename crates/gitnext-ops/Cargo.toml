[package]
name = "gitnext-ops"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
git2 = { version = "0.21.0", default-features = false }
gitnext-core = { version = "0.3.0", path = "../gitnext-core" }
gitnext-docs = { version = "0.3.0", path = "../gitnext-docs" }
gitnext-index = { version = "0.3.0", path = "../gitnext-index" }
gitnext-parse = { version = "0.3.0", path = "../gitnext-parse" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
