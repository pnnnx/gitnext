<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="1000" height="330" rx="14" fill="#fbfcfa" stroke="#d5dad3"/><text x="28" y="40" font-size="19" font-weight="700" fill="#1c2433">Code an agent had to read for 6 tasks in a real repo</text><text x="28" y="64" font-size="13" fill="#5e6b78">loca (~120k tokens of Python): architecture question, bug fix, new option + test, rename in 5 files, impact, full test run</text><text x="28" y="118" font-size="14" fill="#1c2433">Agent without gitnext</text><rect x="330" y="100" width="400" height="26" rx="5" fill="#b23b35"/><text x="740" y="119" font-size="14" font-weight="700" fill="#1c2433">49 KB · ~40 tool calls · 6/6</text><text x="28" y="176" font-size="14" fill="#1c2433">Same agent, recounted with gitnext</text><rect x="330" y="158" width="236" height="26" rx="5" fill="#a7741c"/><text x="576" y="177" font-size="14" font-weight="700" fill="#1c2433">29 KB (−41%)</text><text x="28" y="234" font-size="14" fill="#1c2433">With gitnext look (batched)</text><rect x="330" y="216" width="179" height="26" rx="5" fill="#2f7a4a"/><text x="519" y="235" font-size="14" font-weight="700" fill="#1c2433">22 KB · 6 tool calls · 6/6</text><text x="28" y="290" font-size="12.5" fill="#5e6b78">Every tool call re-sends the whole conversation, so fewer calls matter more than shorter output.</text><text x="28" y="310" font-size="12.5" fill="#5e6b78">Last bar: one run by the author who knew the tasks — a fresh agent needs more steps. Reproduce: integrations/ab/.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>