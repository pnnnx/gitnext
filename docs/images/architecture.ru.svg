<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8e99a3"/></marker></defs><rect width="1000" height="430" rx="14" fill="#fbfcfa" stroke="#d5dad3"/><text x="28" y="40" font-size="19" font-weight="700" fill="#1c2433">Как устроен gitnext</text><rect x="28" y="70" width="190" height="110" rx="10" fill="#ffffff" stroke="#b9c1b8" stroke-width="1.5"/><text x="123.0" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2433">Ваш репозиторий</text><text x="123.0" y="118" text-anchor="middle" font-size="12.5" fill="#5e6b78">обычный git — GitHub,</text><text x="123.0" y="136" text-anchor="middle" font-size="12.5" fill="#5e6b78">CI и git работают как раньше</text><rect x="268" y="70" width="200" height="110" rx="10" fill="#eef4ff" stroke="#9db6e8" stroke-width="1.5"/><text x="368.0" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2433">Парсеры</text><text x="368.0" y="118" text-anchor="middle" font-size="12.5" fill="#5e6b78">tree-sitter: Rust, Python,</text><text x="368.0" y="136" text-anchor="middle" font-size="12.5" fill="#5e6b78">C, C++ → функции, типы,</text><text x="368.0" y="154" text-anchor="middle" font-size="12.5" fill="#5e6b78">входы, выходы, описания</text><rect x="518" y="70" width="200" height="110" rx="10" fill="#eef4ff" stroke="#9db6e8" stroke-width="1.5"/><text x="618.0" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2433">Индекс</text><text x="618.0" y="118" text-anchor="middle" font-size="12.5" fill="#5e6b78">.gitnext/index.db (SQLite)</text><text x="618.0" y="136" text-anchor="middle" font-size="12.5" fill="#5e6b78">перечитываются только</text><text x="618.0" y="154" text-anchor="middle" font-size="12.5" fill="#5e6b78">изменённые файлы</text><rect x="768" y="70" width="204" height="110" rx="10" fill="#eef4ff" stroke="#9db6e8" stroke-width="1.5"/><text x="870.0" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2433">Граф кода</text><text x="870.0" y="118" text-anchor="middle" font-size="12.5" fill="#5e6b78">кто что вызывает,</text><text x="870.0" y="136" text-anchor="middle" font-size="12.5" fill="#5e6b78">наследование, влияние,</text><text x="870.0" y="154" text-anchor="middle" font-size="12.5" fill="#5e6b78">тесты, слои, diff</text><line x1="218" y1="125" x2="266" y2="125" stroke="#8e99a3" stroke-width="1.6" marker-end="url(#a)"/><line x1="468" y1="125" x2="516" y2="125" stroke="#8e99a3" stroke-width="1.6" marker-end="url(#a)"/><line x1="718" y1="125" x2="766" y2="125" stroke="#8e99a3" stroke-width="1.6" marker-end="url(#a)"/><rect x="28" y="260" width="190" height="130" rx="10" fill="#f3efe2" stroke="#d8c58f" stroke-width="1.5"/><text x="123.0" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2433">Карта кода</text><text x="123.0" y="308" text-anchor="middle" font-size="12.5" fill="#5e6b78">.gitnext/map/**/DIR.md</text><text x="123.0" y="326" text-anchor="middle" font-size="12.5" fill="#5e6b78">+ блок в AGENTS.md</text><text x="123.0" y="344" text-anchor="middle" font-size="12.5" fill="#5e6b78">(в git, её читают агенты)</text><rect x="268" y="260" width="200" height="130" rx="10" fill="#e8f5ec" stroke="#8fc7a0" stroke-width="1.5"/><text x="368.0" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2433">CLI</text><text x="368.0" y="308" text-anchor="middle" font-size="12.5" fill="#5e6b78">gitnext look · status</text><text x="368.0" y="326" text-anchor="middle" font-size="12.5" fill="#5e6b78">commit · rename · impact</text><text x="368.0" y="344" text-anchor="middle" font-size="12.5" fill="#5e6b78">…и любая команда git</text><rect x="518" y="260" width="200" height="130" rx="10" fill="#e8f5ec" stroke="#8fc7a0" stroke-width="1.5"/><text x="618.0" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2433">TUI</text><text x="618.0" y="308" text-anchor="middle" font-size="12.5" fill="#5e6b78">обзор кода + git</text><text x="618.0" y="326" text-anchor="middle" font-size="12.5" fill="#5e6b78">понятными словами: stage</text><text x="618.0" y="344" text-anchor="middle" font-size="12.5" fill="#5e6b78">одной функции, undo</text><rect x="768" y="260" width="204" height="130" rx="10" fill="#f1ecfb" stroke="#b8a3e6" stroke-width="1.5"/><text x="870.0" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2433">MCP-сервер</text><text x="870.0" y="308" text-anchor="middle" font-size="12.5" fill="#5e6b78">Claude Code · Cursor</text><text x="870.0" y="326" text-anchor="middle" font-size="12.5" fill="#5e6b78">Codex · локальные модели</text><text x="870.0" y="344" text-anchor="middle" font-size="12.5" fill="#5e6b78">(llama.cpp / Ollama)</text><path d="M870 180 C 870 220, 123 215, 123 256" fill="none" stroke="#8e99a3" stroke-width="1.6" marker-end="url(#a)"/><path d="M870 180 C 870 222, 368 218, 368 256" fill="none" stroke="#8e99a3" stroke-width="1.6" marker-end="url(#a)"/><path d="M870 180 C 870 222, 618 218, 618 256" fill="none" stroke="#8e99a3" stroke-width="1.6" marker-end="url(#a)"/><path d="M870 180 C 870 222, 870 218, 870 256" fill="none" stroke="#8e99a3" stroke-width="1.6" marker-end="url(#a)"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>