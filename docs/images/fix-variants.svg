<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="442" viewBox="0 0 1000 442" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Seeded bugs fixed by Gemma 4 12B: 49 of 102 when shown what changed, 91 of 102 when told which change is the cause, 87 of 102 with the proof shortened and two tries" xmlns:c2pa="http://c2pa.org/manifest">
<title>Seeded bugs fixed by Gemma 4 12B: 49 of 102 when shown what changed, 91 of 102 when told which change is the cause, 87 of 102 with the proof shortened and two tries</title>
<rect width="1000" height="442" rx="14" fill="#fbfcfa" stroke="#d5dad3"/>
<text x="28" y="40" font-size="19" font-weight="700" fill="#1c2433">Fixing a seeded bug: tell the model which change broke the test</text>
<text x="28" y="64" font-size="13" fill="#5e6b78">Gemma 4 12B · the same 102 tasks in each variant · six projects · judged by the projects&#x27; own tests</text>
<rect x="28" y="82" width="12" height="12" rx="3" fill="#eb6834"/><text x="46" y="93" font-size="13" fill="#1c2433">what changed since the tests passed</text><rect x="320.5" y="82" width="12" height="12" rx="3" fill="#2a78d6"/><text x="338.5" y="93" font-size="13" fill="#1c2433">the change proven to be the cause</text><rect x="598.8" y="82" width="12" height="12" rx="3" fill="#16a08b"/><text x="616.8" y="93" font-size="13" fill="#1c2433">the proof, shorter, plus two tries</text>
