<text x="734.9" y="343.5" font-size="13" font-weight="400" fill="#1c2433">85%  ·  87 of 102</text>
<text x="28" y="388" font-size="12.5" fill="#5e6b78">The proof turned 45 failures into fixes and 3 fixes into failures (95% interval +30 to +52 points, p &lt; 0.001), for the same tokens.</text><text x="28" y="408" font-size="12.5" fill="#5e6b78">Combining it with a shorter answer and a try tool does not help: 7 gained, 11 lost. Gemma 4 31B solves 116 of 117 either way.</text>
