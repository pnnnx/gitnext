<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="446" viewBox="0 0 1000 446" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Share of seeded bugs where gitnext why names the function at fault first: 18% from the call graph, 86% with the learned coverage map">
<title>Share of seeded bugs where gitnext why names the function at fault first: 18% from the call graph, 86% with the learned coverage map</title>
<rect width="1000" height="446" rx="14" fill="#fbfcfa" stroke="#d5dad3"/>
<text x="28" y="40" font-size="19" font-weight="700" fill="#1c2433">A test fails: is the function at fault first in the list?</text>
<text x="28" y="64" font-size="13" fill="#5e6b78">57 seeded bugs in 6 projects: one operator changed inside a function, then gitnext why &lt;failing test&gt; is asked</text>
<rect x="28" y="82" width="12" height="12" rx="3" fill="#eb6834"/><text x="46" y="93" font-size="13" fill="#1c2433">from the call graph alone</text>
<rect x="252.0" y="82" width="12" height="12" rx="3" fill="#2a78d6"/><text x="270.0" y="93" font-size="13" fill="#1c2433">after gitnext learn-tests (one test run with coverage)</text>
<path d="M330 114V364" stroke="#d5dad3" stroke-width="1"/>
<text x="28" y="137" font-size="14" font-weight="600" fill="#1c2433">Python</text>
<text x="28" y="155" font-size="12" fill="#5e6b78">click, sqlparse</text>
<path d="M330 122h19.5a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-19.5z" fill="#eb6834"/>
<text x="363.5" y="135.5" font-size="13" font-weight="400" fill="#1c2433">5%  ·  1 of 20</text>
