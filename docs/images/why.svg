<text x="763.0" y="155.5" font-size="13" font-weight="700" fill="#1c2433">90%  ·  18 of 20</text>
<text x="28" y="201" font-size="14" font-weight="600" fill="#1c2433">Go</text>
<text x="28" y="219" font-size="12" fill="#5e6b78">cobra, chi</text>
<path d="M330 186h161.9a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-161.9z" fill="#eb6834"/>
<text x="505.9" y="199.5" font-size="13" font-weight="400" fill="#1c2433">35%  ·  6 of 17</text>
<path d="M330 206h383.1a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-383.1z" fill="#2a78d6"/>
<text x="727.1" y="219.5" font-size="13" font-weight="700" fill="#1c2433">82%  ·  14 of 17</text>
<text x="28" y="265" font-size="14" font-weight="600" fill="#1c2433">Rust</text>
<text x="28" y="283" font-size="12" fill="#5e6b78">semver, indexmap</text>
<path d="M330 250h66.5a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-66.5z" fill="#eb6834"/>
<text x="410.5" y="263.5" font-size="13" font-weight="400" fill="#1c2433">15%  ·  3 of 20</text>
<path d="M330 270h395.5a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-395.5z" fill="#2a78d6"/>
<text x="739.5" y="283.5" font-size="13" font-weight="700" fill="#1c2433">85%  ·  17 of 20</text>
<text x="28" y="329" font-size="14" font-weight="600" fill="#1c2433">All six projects</text>
<path d="M330 314h78.5a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-78.5z" fill="#eb6834"/>
<text x="422.5" y="327.5" font-size="13" font-weight="400" fill="#1c2433">18%  ·  10 of 57</text>
<path d="M330 334h400.0a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-400.0z" fill="#2a78d6"/>
<text x="744.0" y="347.5" font-size="13" font-weight="700" fill="#1c2433">86%  ·  49 of 57</text>
<text x="28" y="392" font-size="12.5" fill="#5e6b78">With the map, why lists what the test really ran, puts the code changed since the tests last passed on top, and shows the changed lines.</text>
<text x="28" y="412" font-size="12.5" fill="#5e6b78">Reproduce: python3 eval/why_rank.py --learn --variants static,default — tables in eval/results/why-rank*.md</text>
</svg>
