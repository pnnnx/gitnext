<title>Tasks solved with plain tools and with the five gitnext tools: Gemma 4 12B 55 and 84 of 120, gpt-oss-20b 48 and 77, Ministral 3 14B 51 and 85, Granite 4.1 8B 38 and 85, the four together 192 and 331 of 480, Qwen 3.5 9B 47 and 53 of 72</title>
