<text x="28" y="520" font-size="12.5" fill="#5e6b78">Every model gains on its own (p &lt; 0.001 each). Without gitnext they lie 14 points apart (32–46%), with it 7 (64–71%).</text><text x="28" y="540" font-size="12.5" fill="#5e6b78">Listing the callers gains most: 26 → 99 of 120. Fixing a seeded bug stays the weak kind: 16 → 40 of 120.</text>
