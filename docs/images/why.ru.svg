<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="446" viewBox="0 0 1000 446" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Доля подсаженных ошибок, где gitnext why называет виновную функцию первой: 18% по графу вызовов, 86% с картой покрытия">
<title>Доля подсаженных ошибок, где gitnext why называет виновную функцию первой: 18% по графу вызовов, 86% с картой покрытия</title>
<rect width="1000" height="446" rx="14" fill="#fbfcfa" stroke="#d5dad3"/>
<text x="28" y="40" font-size="19" font-weight="700" fill="#1c2433">Тест упал: стоит ли виновная функция первой в списке?</text>
<text x="28" y="64" font-size="13" fill="#5e6b78">57 подсаженных ошибок в 6 проектах: в функции меняется один оператор, затем спрашиваем gitnext why &lt;упавший тест&gt;</text>
<rect x="28" y="82" width="12" height="12" rx="3" fill="#eb6834"/><text x="46" y="93" font-size="13" fill="#1c2433">только по графу вызовов</text>
<rect x="237.6" y="82" width="12" height="12" rx="3" fill="#2a78d6"/><text x="255.6" y="93" font-size="13" fill="#1c2433">после gitnext learn-tests (один прогон тестов с покрытием)</text>
