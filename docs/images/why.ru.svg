<text x="739.5" y="283.5" font-size="13" font-weight="700" fill="#1c2433">85%  ·  17 из 20</text>
<text x="28" y="329" font-size="14" font-weight="600" fill="#1c2433">Все шесть проектов</text>
<path d="M330 314h78.5a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-78.5z" fill="#eb6834"/>
