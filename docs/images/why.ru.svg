<path d="M330 206h383.1a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-383.1z" fill="#2a78d6"/>
<text x="727.1" y="219.5" font-size="13" font-weight="700" fill="#1c2433">82%  ·  14 из 17</text>
