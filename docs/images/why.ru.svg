<text x="28" y="392" font-size="12.5" fill="#5e6b78">С картой why показывает то, что тест на деле запускал, ставит первым код, изменённый с тех пор, как тесты проходили, и сами изменённые строки.</text>
<text x="28" y="412" font-size="12.5" fill="#5e6b78">Воспроизвести: python3 eval/why_rank.py --learn --variants static,default — таблицы в eval/results/why-rank*.md</text>
