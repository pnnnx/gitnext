<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="1000" height="330" rx="14" fill="#fbfcfa" stroke="#d5dad3"/><text x="28" y="40" font-size="19" font-weight="700" fill="#1c2433">Сколько кода прочитал агент на 6 задачах в настоящем проекте</text><text x="28" y="64" font-size="13" fill="#5e6b78">loca (~120k токенов Python): вопрос по архитектуре, баг, новая опция с тестом, переименование в 5 файлах, влияние, все тесты</text><text x="28" y="118" font-size="14" fill="#1c2433">Агент без gitnext</text><rect x="330" y="100" width="400" height="26" rx="5" fill="#b23b35"/><text x="740" y="119" font-size="14" font-weight="700" fill="#1c2433">49 KB · ~40 вызовов · 6/6</text><text x="28" y="176" font-size="14" fill="#1c2433">Тот же агент, пересчёт с gitnext</text><rect x="330" y="158" width="236" height="26" rx="5" fill="#a7741c"/><text x="576" y="177" font-size="14" font-weight="700" fill="#1c2433">29 KB (−41%)</text><text x="28" y="234" font-size="14" fill="#1c2433">С gitnext look (пачкой)</text><rect x="330" y="216" width="179" height="26" rx="5" fill="#2f7a4a"/><text x="519" y="235" font-size="14" font-weight="700" fill="#1c2433">22 KB · 6 вызовов · 6/6</text><text x="28" y="290" font-size="12.5" fill="#5e6b78">Каждый вызов инструмента заново отправляет весь разговор, поэтому меньше шагов важнее, чем короче вывод.</text><text x="28" y="310" font-size="12.5" fill="#5e6b78">Последняя строка — один прогон автора, знавшего задачи; свежему агенту шагов нужно больше. Повторить: integrations/ab/.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>