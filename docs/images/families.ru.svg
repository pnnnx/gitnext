<text x="28" y="520" font-size="12.5" fill="#5e6b78">Выигрывает каждая модель (у каждой p &lt; 0,001). Без gitnext модели расходятся на 14 пунктов (32–46%), с ним — на 7 (64–71%).</text><text x="28" y="540" font-size="12.5" fill="#5e6b78">Больше всего прирост в поиске вызывающих: 26 → 99 из 120. Починка ошибки остаётся слабым местом: 16 → 40 из 120.</text>
