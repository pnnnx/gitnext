<text x="340.0" y="347.5" font-size="13" font-weight="700" fill="#1c2433">0 из 6</text>
<text x="28" y="392" font-size="12.5" fill="#5e6b78">24 задания: с обычными инструментами решено 4, с gitnext — 17 (15, если от модели не требовать сначала посмотреть код).</text>
<text x="28" y="412" font-size="12.5" fill="#5e6b78">Починка ошибки пока не решена: здесь 0 из 6; в более позднем замере на click 3 из 12 — когда gitnext why узнал, что на деле запускает упавший тест.</text>
