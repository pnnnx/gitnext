<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="446" viewBox="0 0 1000 446" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Задания, решённые локальной моделью на 4B: с обычными инструментами 4 из 24, с gitnext 17 из 24">
<title>Задания, решённые локальной моделью на 4B: с обычными инструментами 4 из 24, с gitnext 17 из 24</title>
<rect width="1000" height="446" rx="14" fill="#fbfcfa" stroke="#d5dad3"/>
<text x="28" y="40" font-size="19" font-weight="700" fill="#1c2433">Локальная модель на 4B в настоящих проектах: решено заданий</text>
<text x="28" y="64" font-size="13" fill="#5e6b78">Qwen 3.5 4B на llama.cpp · click (Python) и semver (Rust) · по 6 заданий каждого вида · судят компилятор и тесты самих проектов</text>
